services:
  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --save ""
      --appendonly no
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    command: server /data --console-address ":9001"
    ports:
      - "9100:9000"
      - "127.0.0.1:9101:9001"   # console MinIO HML
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin_hml_2026}
    volumes:
      - minio_hml_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --workers 2
    ports:
      - "8100:8000"             # API HML em :8100
    env_file: ../.env.hml
    depends_on:
      redis:    { condition: service_healthy }
      minio:    { condition: service_healthy }
    restart: unless-stopped

  worker-etl:
    build:
      context: ..
      dockerfile: worker/Dockerfile
    command: celery -A worker.celery_app worker -Q etl_jobs -c 1 --loglevel=info
    env_file: ../.env.hml
    depends_on:
      redis:    { condition: service_healthy }
      minio:    { condition: service_healthy }
    restart: unless-stopped

volumes:
  minio_hml_data:
